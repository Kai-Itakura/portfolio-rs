[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.10.0", features = [
  "icon-iconify",
  "tailwind",
  "font-fontsource",
] }
ulid = "3.0.0"

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = [
  "icon-iconify",
  "tailwind",
] }
